<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P0 Harness · Greybox Region</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1116;
        color: #e6e9ef;
      }

      #p0-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #harness-panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(440px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        background: rgba(15, 20, 28, 0.9);
        backdrop-filter: blur(12px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: #94a3b8;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #94a3b8;
      }

      select,
      button {
        font: inherit;
        font-size: 12px;
        color: #e6e9ef;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        background: #1a2230;
        padding: 7px 10px;
      }

      select {
        flex: 1;
      }

      button {
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: rgba(125, 211, 252, 0.7);
        background: #223047;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      #harness-status {
        font-size: 12px;
        color: #7dd3fc;
      }

      #harness-status[data-status="failed"] {
        color: #f87171;
      }

      #report-output {
        margin: 0;
        padding: 10px;
        min-height: 120px;
        max-height: 40vh;
        overflow: auto;
        border-radius: 8px;
        background: #0a0e14;
        color: #a5f3fc;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <canvas id="p0-canvas"></canvas>

    <aside id="harness-panel">
      <h1>P0 Harness · Greybox Region</h1>
      <p class="subtitle">
        正交等距相机 + 程序化灰盒几何体。具名 scenario 输出统一 JSON 测量报告。
      </p>
      <div class="row">
        <label for="scenario-select">Scenario</label>
        <select id="scenario-select"></select>
      </div>
      <div class="row">
        <button id="run-scenario" type="button">运行</button>
        <button id="download-report" type="button" disabled>下载 JSON 报告</button>
        <span id="harness-status">初始化中…</span>
      </div>
      <pre id="report-output"></pre>
    </aside>

    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
